<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Printbuddy</title>
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Printbuddy" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon-dark.png" />
    <style>
      html, body { margin: 0; height: 100%; background: #1a1a1a; color: #fff; overflow: hidden;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
      #insets { position: fixed; visibility: hidden; pointer-events: none;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
      #status { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; }
      #status[hidden] { display: none; }
      #logo { width: 180px; max-width: 60vw; height: auto; }
      #message { font-size: 15px; color: #a0a0a0; text-align: center; min-height: 1.4em; }
      #list { list-style: none; margin: 0; padding: 0; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 8px; }
      #list button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px;
        border: 1px solid #3d3d3d; background: #2d2d2d; color: #fff; font: inherit; font-size: 15px; text-align: left; cursor: pointer; }
      #list button:active { background: #3d3d3d; }
      #list .name { flex: 1; min-width: 0; }
      #list .url { display: block; font-size: 12px; color: #808080; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #808080; flex: none; }
      .dot.checking { animation: pulse 1s ease-in-out infinite; }
      .dot.ok { background: #22c55e; }
      .dot.fail { background: #ef4444; }
      @keyframes pulse { 50% { opacity: .3; } }
      #retry { padding: 12px 22px; border-radius: 12px; border: 0; background: #14b8a6; color: #fff; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
      #retry[hidden] { display: none; }
      #frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #1a1a1a; }
      #frame[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="insets"></div>
    <div id="status">
      <img id="logo" src="/img/printbuddy_logo_dark_transparent.png" alt="Printbuddy" />
      <div id="message"></div>
      <ul id="list"></ul>
      <button id="retry" type="button" hidden></button>
    </div>
    <iframe id="frame" title="Printbuddy" allow="fullscreen; clipboard-write" hidden></iframe>
    <script src="/launch.js"></script>
    <script src="/sw-register.js"></script>
  </body>
</html>
