name: Docker publish

on:
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  # Docker Hub repository. Keep this in sync with the Docker Hub repo name.
  # If the account/repo ever changes, set repository variable DOCKERHUB_IMAGE
  # in GitHub Actions instead of editing this workflow.
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'vmhomelabde/printbuddy' }}
  DOCKERHUB_UPDATER_IMAGE: ${{ vars.DOCKERHUB_UPDATER_IMAGE || 'vmhomelabde/printbuddy-updater' }}

jobs:
  build-and-push:
    name: Build and publish Printbuddy image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release APP_VERSION
        shell: bash
        run: |
          set -euo pipefail
          expected=""

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            expected="${GITHUB_REF_NAME#v}"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            expected="$({ git tag --points-at HEAD --list 'v*' | sed 's/^v//' | sort -V | tail -n 1; } || true)"
          fi

          if [[ -n "${expected}" ]]; then
            python scripts/app_version.py --expected "${expected}"
          else
            echo "No release tag points at this ref; skipping APP_VERSION release check."
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Docker updater metadata
        id: updater-meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.DOCKERHUB_UPDATER_IMAGE }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push Printbuddy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PRINTBUDDY_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Printbuddy updater
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.updater
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.updater-meta.outputs.tags }}
          labels: ${{ steps.updater-meta.outputs.labels }}
          cache-from: type=gha,scope=updater
          cache-to: type=gha,mode=max,scope=updater
