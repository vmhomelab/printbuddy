# Optional slicer-API sidecar stack for Printbuddy.
#
# Both services are HTTP wrappers around a slicer CLI: the same Node code
# (configured via SLICER_API_BUILD_CONTEXT in .env) bundled with a
# different binary in each image. Printbuddy talks to them via the
# URLs configured in Settings -> Slicer.
#
#   bambu-studio-api  → host port 3001 (BambuStudio CLI)
#   orca-slicer-api   → host port 3003 (OrcaSlicer CLI)
#
# Printbuddy's virtual-printer feature reserves host ports 3000 and 3002,
# which is why the OrcaSlicer sidecar sits on 3003. Override either port
# in `.env` (see `.env.example`) if you don't run Printbuddy on this host.
#
# Usage:
#   cd slicer-api/
#   cp .env.example .env
#   docker compose up -d                       # OrcaSlicer only
#   docker compose --profile bambu up -d       # Bambu Studio and OrcaSlicer
#
# `up` pulls the prebuilt images from Docker Hub (BAMBU_STUDIO_API_IMAGE /
# ORCA_SLICER_API_IMAGE in .env). To build them yourself from the pinned
# sidecar source instead, run `docker compose --profile bambu build` first;
# that downloads the slicer AppImage (~220 MB for Bambu Studio) and takes a
# few minutes.
#
# The ports bind to loopback only: Printbuddy runs in host-network mode and
# reaches them via localhost, while the unauthenticated sidecar must not be
# exposed to the LAN.

services:
  orca-slicer-api:
    build:
      context: "${SLICER_API_BUILD_CONTEXT:-https://github.com/vmhomelab/orca-slicer-api.git#661cd475085b7699280ac6307dbb5d06af41b04f}"
      dockerfile: Dockerfile
      args:
        ORCA_VERSION: "${ORCA_VERSION:-2.3.2}"
        SIDECAR_REVISION: "${SIDECAR_REVISION:-661cd475085b7699280ac6307dbb5d06af41b04f}"
    image: "${ORCA_SLICER_API_IMAGE:-docker.io/vmhomelabde/printbuddy-orca-slicer-api:latest}"
    container_name: orca-slicer-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ORCA_API_PORT:-3003}:3000"
    volumes:
      - ./data/orca:/app/data
    environment:
      NODE_ENV: production
      PORT: "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  bambu-studio-api:
    build:
      context: "${SLICER_API_BUILD_CONTEXT:-https://github.com/vmhomelab/orca-slicer-api.git#661cd475085b7699280ac6307dbb5d06af41b04f}"
      dockerfile: Dockerfile.bambu-studio
      args:
        BAMBU_VERSION: "${BAMBU_VERSION:-02.08.02.61}"
        BAMBU_APPIMAGE_URL: "${BAMBU_APPIMAGE_URL:-}"
        SIDECAR_REVISION: "${SIDECAR_REVISION:-661cd475085b7699280ac6307dbb5d06af41b04f}"
    image: "${BAMBU_STUDIO_API_IMAGE:-docker.io/vmhomelabde/printbuddy-bambu-studio-api:latest}"
    container_name: bambu-studio-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BAMBU_API_PORT:-3001}:3000"
    volumes:
      - ./data/bambu:/app/data
    environment:
      NODE_ENV: production
      PORT: "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    profiles:
      - bambu
