# nginx reverse proxy in front of Printbuddy (app assumed on port 8000, same host).
# It serves launcher.html and pins the app so only the page content scrolls
# (keeps the top bar fixed in the iOS home screen app).
#
# Framing is allowed by Printbuddy itself: set TRUSTED_FRAME_ORIGINS on the app
# to both launcher origins (see README.md). The app's security headers are
# passed through unchanged.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 8080;
  root /usr/share/nginx/html;
  location = /launcher.html { add_header Cache-Control "no-store"; }
  location = /icon-180.png { }
  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # sub_filter only works on uncompressed responses.
    proxy_set_header Accept-Encoding "";
    sub_filter "</head>" "<style>html,body,#root,#root>div{height:100%!important;min-height:0!important;overflow:hidden!important}</style></head>";
    sub_filter_once on;
  }
}
