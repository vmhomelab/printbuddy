<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Printbuddy</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Printbuddy">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#101729">
<link rel="apple-touch-icon" href="/icon-180.png">
<style>
  html,body{margin:0;height:100%;background:#101729;color:#fff;font-family:-apple-system,system-ui,sans-serif;overflow:hidden}
  #msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #wrap{position:fixed;inset:0}
  #wrap iframe{display:block;width:100%;height:100%;border:0;background:#101729}
</style>
</head>
<body>
<div id="msg">Connecting…</div>
<div id="wrap"></div>
<script>
// EDIT THESE TWO LINES. Port 8080 is the proxy from launcher.conf, not the app's own port.
const HOME = "http://YOUR_LOCAL_IP:8080";      // tried first (on home Wi-Fi)
const AWAY = "http://YOUR_TAILSCALE_IP:8080";  // fallback (anywhere else)
const TIMEOUT_MS = 1500;

const ctl = new AbortController();
const timer = setTimeout(() => ctl.abort(), TIMEOUT_MS);

fetch(HOME, { mode: "no-cors", cache: "no-store", signal: ctl.signal })
  .then(() => { clearTimeout(timer); openApp(HOME); })
  .catch(() => { openApp(AWAY); });

function openApp(url) {
  document.getElementById("msg").remove();
  const f = document.createElement("iframe");
  f.src = url;
  f.allow = "fullscreen; clipboard-write";
  document.getElementById("wrap").appendChild(f);
}
</script>
</body>
</html>
